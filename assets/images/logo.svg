<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9"/>
      <stop offset="25%" stop-color="#E5C17D"/>
      <stop offset="60%" stop-color="#C59B48"/>
      <stop offset="90%" stop-color="#9E7326"/>
      <stop offset="100%" stop-color="#DFBA73"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C59B48" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FDF3C7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C59B48" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Monogram Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer Octagon / Diamond Luxury Frame -->
    <rect x="12" y="12" width="76" height="76" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.6"/>
    <rect x="18" y="18" width="64" height="64" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="0.9" opacity="0.4"/>
    
    <!-- Stylized Luxury "B" Monogram -->
    <!-- Vertical stem with flourish -->
    <path d="M36 28 L36 72 M42 28 L42 72" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Top Bowl of B -->
    <path d="M42 28 C58 28, 68 33, 68 45 C68 53, 58 56, 42 56" fill="none" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Bottom Bowl of B -->
    <path d="M42 56 C62 56, 74 60, 74 69 C74 77, 60 72, 42 72" fill="none" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round"/>
    
    <!-- Intersecting geometric accent curve -->
    <path d="M26 36 L48 24 M26 64 L48 76" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Center diamond pip -->
    <polygon points="50,47 53,50 50,53 47,50" fill="url(#goldGrad)"/>
    <!-- Corner accent dots -->
    <circle cx="20" cy="20" r="1.5" fill="url(#goldGrad)"/>
    <circle cx="80" cy="20" r="1.5" fill="url(#goldGrad)"/>
    <circle cx="20" cy="80" r="1.5" fill="url(#goldGrad)"/>
    <circle cx="80" cy="80" r="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(118, 0)">
    <!-- Brand Title -->
    <text x="0" y="52" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="4" fill="url(#goldGrad)">
      BHABHA GLOBAL
    </text>

    <!-- Subtitle with side decorative lines -->
    <line x1="2" y1="68" x2="65" y2="68" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
    <text x="74" y="72" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10.5" font-weight="600" letter-spacing="4.5" fill="#E2E8F0">
      TAX AND ADVISORY
    </text>
    <line x1="262" y1="68" x2="330" y2="68" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>

    <!-- Italic Tagline -->
    <text x="4" y="93" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="13" font-weight="400" letter-spacing="0.5" fill="url(#goldGrad)" opacity="0.95">
      Global Finance, Delivered Remotely.
    </text>
  </g>
</svg>
